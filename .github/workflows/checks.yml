name: App checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regression and performance checks
        run: ./scripts/check.sh --performance
      - name: Build app and ZIP
        run: ./scripts/build_app_bundle.sh
      - name: Test package validation
        run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Verify package and release version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/verify_app_bundle.py "$RELEASE_TAG"
